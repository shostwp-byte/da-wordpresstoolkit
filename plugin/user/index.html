#!/bin/sh
cat <<'DAWPTK_USER_HTML'
<div id="dawptk-root" data-theme="light">
  <script>
    if (window.self !== window.top) {
      document.documentElement.classList.add('dawptk-iframe');
    }
  </script>
  <style>
    html.dawptk-iframe, html.dawptk-iframe body {
      margin: 0;
      padding: 0;
      background: transparent;
    }
    #dawptk-root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --surface-2: #f1f5f9;
      --card-hdr: #eef2ff;
      --card-hdr-border: #e0e7ff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-2: #334155;
      --muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-btn: #6366f1;
      --primary-soft: #eef2ff;
      --green-bg: #dcfce7;
      --green-text: #15803d;
      --green-border: #bbf7d0;
      --amber-bg: #fef3c7;
      --amber-text: #b45309;
      --amber-border: #fde68a;
      --red-bg: #fee2e2;
      --red-text: #b91c1c;
      --red-border: #fecaca;
      --slate-bg: #e2e8f0;
      --slate-text: #334155;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.18);

      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 26px 28px;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      position: relative;
      box-shadow: var(--shadow-sm);
    }
    html.dark #dawptk-root:not([data-user-theme="light"]),
    body.dark #dawptk-root:not([data-user-theme="light"]),
    [data-theme="dark"] #dawptk-root:not([data-user-theme="light"]),
    #dawptk-root[data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273549;
      --card-hdr: #1e293b;
      --card-hdr-border: #334155;
      --border: #334155;
      --border-strong: #475569;
      --text: #f8fafc;
      --text-2: #cbd5e1;
      --muted: #94a3b8;
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --primary-btn: #6366f1;
      --primary-soft: rgba(99, 102, 241, 0.16);
      --green-bg: rgba(22, 163, 74, 0.2);
      --green-text: #4ade80;
      --green-border: rgba(74, 222, 128, 0.3);
      --amber-bg: rgba(217, 119, 6, 0.2);
      --amber-text: #fbbf24;
      --amber-border: rgba(251, 191, 36, 0.3);
      --red-bg: rgba(220, 38, 38, 0.2);
      --red-text: #f87171;
      --red-border: rgba(248, 113, 113, 0.3);
      --slate-bg: #334155;
      --slate-text: #e2e8f0;
    }
    #dawptk-root *, #dawptk-root *::before, #dawptk-root *::after {
      box-sizing: border-box;
    }
    #dawptk-root button, #dawptk-root input, #dawptk-root select, #dawptk-root textarea {
      font-family: inherit;
      font-size: inherit;
    }
    #dawptk-root a {
      color: var(--primary);
      text-decoration: none;
    }
    #dawptk-root a:hover {
      text-decoration: underline;
    }

    /* Top Header */
    .wptk-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .wptk-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .wptk-brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .wptk-title {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .wptk-subtitle {
      margin: 3px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }
    .wptk-top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Buttons */
    .wptk-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-2);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.14s ease;
      white-space: nowrap;
      user-select: none;
    }
    .wptk-btn:hover:not(:disabled) {
      background: var(--surface);
      border-color: var(--border-strong);
      color: var(--text);
    }
    .wptk-btn:disabled {
      opacity: 0.52;
      cursor: not-allowed;
    }
    .wptk-btn-primary {
      background: var(--primary-btn);
      border-color: var(--primary-btn);
      color: #ffffff !important;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(79, 70, 229, 0.22);
    }
    .wptk-btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      color: #ffffff !important;
    }
    .wptk-btn-danger {
      color: var(--red-text);
      border-color: var(--red-border);
    }
    .wptk-btn-danger:hover:not(:disabled) {
      background: var(--red-bg);
      border-color: var(--red-text);
      color: var(--red-text);
    }
    .wptk-btn-sm {
      height: 29px;
      padding: 0 10px;
      font-size: 12px;
      border-radius: 7px;
    }
    .wptk-btn-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 8px;
    }
    .wptk-link-btn {
      background: none;
      border: none;
      padding: 0;
      color: var(--primary);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }
    .wptk-link-btn:hover {
      text-decoration: underline;
    }

    /* Global Tabs & Search Row */
    .wptk-nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .wptk-gtabs {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
    }
    .wptk-gtab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 14px;
      border: none;
      border-bottom: 2.5px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.14s ease, border-color 0.14s ease;
      margin-bottom: -1px;
    }
    .wptk-gtab:hover {
      color: var(--text);
    }
    .wptk-gtab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .wptk-tab-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 19px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }
    .wptk-gtab.active .wptk-tab-count {
      background: var(--primary-soft);
      color: var(--primary);
    }
    .wptk-search-wrap {
      position: relative;
      width: 275px;
      max-width: 100%;
      margin-bottom: 6px;
    }
    .wptk-search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      display: flex;
    }
    .wptk-search-input {
      width: 100%;
      height: 35px;
      padding: 0 12px 0 34px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 12.5px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .wptk-search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    /* Bulk Action Toolbar & View Switcher */
    .wptk-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .wptk-toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .wptk-check-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: var(--text-2);
      cursor: pointer;
      padding-right: 6px;
      user-select: none;
    }
    .wptk-checkbox {
      width: 15px;
      height: 15px;
      accent-color: var(--primary-btn);
      cursor: pointer;
      margin: 0;
    }
    .wptk-view-switch {
      display: inline-flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 2px;
      gap: 2px;
    }
    .wptk-view-btn {
      width: 30px;
      height: 28px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .wptk-view-btn.active {
      background: var(--primary-btn);
      color: #ffffff;
    }

    /* Badges / Pills */
    .wptk-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 22px;
      padding: 0 8.5px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .wptk-pill-green {
      background: var(--green-bg);
      color: var(--green-text);
      border: 1px solid var(--green-border);
    }
    .wptk-pill-amber {
      background: var(--amber-bg);
      color: var(--amber-text);
      border: 1px solid var(--amber-border);
    }
    .wptk-pill-red {
      background: var(--red-bg);
      color: var(--red-text);
      border: 1px solid var(--red-border);
    }
    .wptk-pill-slate {
      background: var(--slate-bg);
      color: var(--slate-text);
    }
    .wptk-pill-indigo {
      background: var(--primary-soft);
      color: var(--primary);
    }

    /* 2-Column Instance Card (Reference Match) */
    .wptk-inst-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .wptk-inst-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg);
      overflow: hidden;
      transition: box-shadow 0.16s ease, border-color 0.16s ease;
    }
    .wptk-inst-card:hover {
      border-color: var(--border-strong);
    }
    .wptk-inst-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: var(--card-hdr);
      border-bottom: 1px solid var(--card-hdr-border);
      flex-wrap: wrap;
    }
    .wptk-inst-card.collapsed .wptk-inst-hdr {
      border-bottom-color: transparent;
    }
    .wptk-inst-hdr-left {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .wptk-inst-domain {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .wptk-inst-hdr-right {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }
    .wptk-inst-body {
      display: grid;
      grid-template-columns: 256px minmax(0, 1fr);
      min-height: 360px;
    }

    /* Left Column: Mini Browser Preview & Telemetry */
    .wptk-col-left {
      padding: 18px 16px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }
    .wptk-browser {
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--bg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .wptk-browser-bar {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .wptk-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .wptk-browser-url {
      margin-left: 5px;
      font-size: 10.5px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .wptk-browser-canvas {
      padding: 22px 12px 20px;
      background: linear-gradient(180deg, var(--primary-soft) 0%, var(--bg) 100%);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }
    .wptk-browser-emblem {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
    }
    .wptk-browser-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .wptk-browser-theme {
      font-size: 11px;
      color: var(--muted);
    }
    .wptk-kv-rows {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }
    .wptk-kv-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--muted);
    }
    .wptk-kv-val {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--text);
    }
    .wptk-path-foot {
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
      line-height: 1.4;
    }

    /* Right Column: 5 Sub-Tabs Workspace */
    .wptk-col-right {
      padding: 6px 22px 22px;
      min-width: 0;
    }
    .wptk-subtabs {
      display: flex;
      align-items: center;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
      overflow-x: auto;
    }
    .wptk-subtab {
      padding: 10px 13px;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      margin-bottom: -1px;
    }
    .wptk-subtab:hover {
      color: var(--text);
    }
    .wptk-subtab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* Information & Tools Sub-Tab */
    .wptk-sec-heading {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 12px;
    }
    .wptk-gen-grid {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      row-gap: 10px;
      column-gap: 12px;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .wptk-gen-label {
      color: var(--muted);
    }
    .wptk-gen-val {
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .wptk-tools-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .wptk-toggles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
      gap: 12px;
    }
    .wptk-toggle-card {
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 13px 14px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      min-height: 86px;
    }
    .wptk-toggle-name {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
    }
    .wptk-toggle-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .wptk-toggle-note {
      font-size: 11.5px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Animated Pill Switch */
    .wptk-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 21px;
      flex-shrink: 0;
    }
    .wptk-switch input {
      opacity: 0;
      width: 0;
      height: 0;
      margin: 0;
    }
    .wptk-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--border-strong);
      border-radius: 999px;
      transition: background-color 0.18s ease;
    }
    .wptk-slider::before {
      position: absolute;
      content: "";
      height: 15px;
      width: 15px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      border-radius: 50%;
      transition: transform 0.18s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    .wptk-switch input:checked + .wptk-slider {
      background-color: var(--primary-btn);
    }
    .wptk-switch input:checked + .wptk-slider::before {
      transform: translateX(17px);
    }

    /* Grid Tiles & Compact Table Views */
    .wptk-tiles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }
    .wptk-tile {
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 16px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .wptk-table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
    }
    .wptk-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    .wptk-table th {
      text-align: left;
      padding: 10px 13px;
      background: var(--surface);
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .wptk-table td {
      padding: 10px 13px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
    }
    .wptk-table tr:last-child td {
      border-bottom: none;
    }

    /* Security Mode Cards & Diff Viewer */
    .wptk-mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .wptk-mode-card {
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 12px 14px;
      background: var(--bg);
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .wptk-mode-card.active {
      border-color: var(--primary-btn);
      background: var(--primary-soft);
    }
    .wptk-code-box {
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.55;
      max-height: 340px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .wptk-diff-add { color: #4ade80; }
    .wptk-diff-del { color: #f87171; }
    .wptk-diff-hdr { color: #93c5fd; font-weight: 600; }

    /* Forms & Modals */
    .wptk-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.52);
      backdrop-filter: blur(2px);
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .wptk-modal {
      width: 100%;
      max-width: 640px;
      max-height: 88vh;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .wptk-modal-lg { max-width: 820px; }
    .wptk-modal-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;

    function api(action, opts) {
      opts = opts || {};
      var isRead = !!READ_ONLY_ACTIONS[action] && !opts.forcePost;
      var url = API_URL;
      var fetchOpts = { credentials: 'same-origin', headers: {} };

      if (isRead && !opts.params) {

    /* Chunked 256KB Binary-Safe .zip Uploader (Supports up to 64 MB Themes/Plugins) */
    function uploadExtensionZip(instanceId, kind, file, activate, onProgress) {
      return new Promise(function (resolve, reject) {
        if (!file || !/\.zip$/i.test(file.name)) {
          return reject(new Error('Vui lòng chọn tệp nén định dạng .zip hợp lệ.'));
        }
        if (file.size > 67108864) {
          return reject(new Error('Kích thước gói .zip vượt quá giới hạn 64 MB.'));
        }
        var randHex = '';
        var arr = new Uint8Array(12);
        if (window.crypto && window.crypto.getRandomValues) {
          window.crypto.getRandomValues(arr);
          for (var i = 0; i < arr.length; i++) randHex += ('0' + arr[i].toString(16)).slice(-2);
        } else {
          randHex = (Date.now().toString(16) + Math.random().toString(16).slice(2) + '000000000000').slice(0, 24);
        }

        var reader = new FileReader();
        reader.onerror = function () { reject(new Error('Không thể đọc tệp .zip từ trình duyệt.')); };
        reader.onload = function () {
          var bytes = new Uint8Array(reader.result);
          var chunkSize = 196608; // 192 KB raw -> 256 KB Base64 (< 512 KB POST cap)
          var totalChunks = Math.max(1, Math.ceil(bytes.length / chunkSize));
          var idx = 0;

          function toB64(sub) {
            var bin = '';
            for (var k = 0; k < sub.length; k++) bin += String.fromCharCode(sub[k]);
            return btoa(bin);
          }

          function nextChunk() {
            var start = idx * chunkSize;
            var end = Math.min(bytes.length, start + chunkSize);
            var isLast = (idx === totalChunks - 1);
            var b64 = toB64(bytes.subarray(start, end));
            if (onProgress) onProgress(Math.round(((idx + 1) / totalChunks) * 100));

            api('upload_zip_chunk', {
              forcePost: true,
              instance_id: instanceId,
              params: {
                upload_id: randHex,
                chunk_index: idx,
                chunk_base64: b64,
                commit: isLast,
                kind: kind,
                activate: !!activate
              }
            }).then(function (res) {
              idx++;
              if (idx < totalChunks) nextChunk();
              else resolve(res);
            }).catch(reject);
          }
          nextChunk();
        };
        reader.readAsArrayBuffer(file);
      });
    }

    /* Real-Time Background Job Polling */
    function hasRunningJobs() {
      for (var i = 0; i < S.jobs.length; i++) {

      return false;

    function trackBackgroundJob() {
      S.drawerOpen = true;

    function pollJobsNow() {
      api('list_jobs', { limit: 15 }).then(function (res) {
        var prevRunning = hasRunningJobs();
        S.jobs = (res.data && res.data.jobs) || [];
        renderDrawer();
        renderTopJobBadge();
        var nowRunning = hasRunningJobs();
        if (prevRunning && !nowRunning) {
          toast('Tác vụ nền đã hoàn tất!', 'ok');
          loadBootstrap(true);
        }
        if (nowRunning) {
          clearTimeout(S.jobTimer);
          S.jobTimer = setTimeout(pollJobsNow, 1500);
        }
      }).catch(function () {});
    }

        S.sets = Array.isArray(d.sets) ? d.sets : [];
        S.jobs = Array.isArray(d.jobs) ? d.jobs : [];

        renderApp();

    function findInstance(id) {

    function upsertLocalInstance(inst) {
      if (!inst || !inst.id) return;
      for (var i = 0; i < S.instances.length; i++) {
        if (S.instances[i].id === inst.id) {
          S.instances[i] = inst;
          return;
        }
      }
      S.instances.unshift(inst);
    }

    function filteredInstances() {
      var q = S.search.trim().toLowerCase();
      if (!q) return S.instances;
      return S.instances.filter(function (it) {
        var hay = [it.domain, it.sub_path, it.site_title, it.admin_user, it.wp_version, it.php_version, it.doc_root].join(' ').toLowerCase();
        return hay.indexOf(q) !== -1;
      });
    }

    function selectedInstanceIds() {
      var ids = [];
      for (var i = 0; i < S.instances.length; i++) {
        var id = S.instances[i].id;
        if (S.selectedIds[id]) ids.push(id);
      }
      return ids;

    function totalPluginCountBadge() {

      for (var i = 0; i < S.instances.length; i++) sum += (S.instances[i].plugin_count || 0);

    /* Render Helpers */
    function shieldBadge(inst) {
      var m = inst.core_shield_mode || 'auto_heal';

    function securityPill(inst) {
      var sc = inst.security_score || 0;
      var tot = inst.security_total || 12;
      var cls = sc >= 9 ? 'wptk-pill-green' : (sc >= 5 ? 'wptk-pill-amber' : 'wptk-pill-red');
      return '<span class="wptk-pill ' + cls + '">' + sc + '/' + tot + '</span>';

    function renderTopJobBadge() {

    function renderGlobalExtensionsTab(isTheme) {
      var groups = isTheme ? S.globalThemes : S.globalPlugins;
      var label = isTheme ? 'Themes' : 'Plugins';
      var q = S.search.trim().toLowerCase();

      var h = '<div class="wptk-toolbar">';
      h += '  <div class="wptk-toolbar-left">';
      h += '    <button type="button" class="wptk-btn wptk-btn-sm ' + (S.extFilter === 'all' ? 'wptk-btn-primary' : '') + '" data-act="set-ext-filter" data-filter="all">Tất cả</button>';
      h += '    <button type="button" class="wptk-btn wptk-btn-sm ' + (S.extFilter === 'outdated' ? 'wptk-btn-primary' : '') + '" data-act="set-ext-filter" data-filter="outdated">Có bản cập nhật</button>';
      h += '    <button type="button" class="wptk-btn wptk-btn-sm ' + (S.extFilter === 'vuln' ? 'wptk-btn-primary' : '') + '" data-act="set-ext-filter" data-filter="vuln">Cảnh báo lỗ hổng CVE</button>';
      h += '  </div>';
      h += '  <button type="button" class="wptk-btn wptk-btn-sm" data-act="reload-global-ext" data-kind="' + (isTheme ? 'theme' : 'plugin') + '">' + IC.refresh + ' Quét lại ' + label + '</button>';
      h += '</div>';

      if (!groups) {
        return h + '<div class="wptk-empty">Đang tổng hợp ' + label + ' trên toàn bộ các website của bạn...</div>';
      }
      var filtered = groups.filter(function (g) {
        if (S.extFilter === 'outdated' && !(g.outdated_sites > 0)) return false;
        if (S.extFilter === 'vuln' && !(g.vulnerable_sites > 0)) return false;
        if (q && (g.title + ' ' + g.slug).toLowerCase().indexOf(q) === -1) return false;
        return true;
      });
      if (filtered.length === 0) {
        return h + '<div class="wptk-empty">Không có ' + label + ' nào khớp bộ lọc hiện tại.</div>';
      }

      h += '<div class="wptk-table-wrap"><table class="wptk-table"><thead><tr><th>' + label + '</th><th>Website đang cài</th><th>Cần cập nhật</th><th>Cảnh báo CVE</th><th style="text-align:right">Cập nhật hàng loạt (Smart Safe Update)</th></tr></thead><tbody>';
      for (var i = 0; i < filtered.length; i++) {
        var g = filtered[i];

          h += '  <div style="display:flex;gap:6px;"><button type="button" class="wptk-btn wptk-btn-sm" data-act="open-edit-set" data-set="' + esc(ps.id) + '">Sửa</button><button type="button" class="wptk-btn wptk-btn-sm wptk-btn-danger" data-act="delete-set" data-set="' + esc(ps.id) + '">' + IC.trash + '</button></div>';
        }
        h += '  </div>';
        h += '</div>';
      }
      h += '</div>';
      return h;
    }

    /* Real-Time Background Job Progress Drawer */
    function renderDrawer() {
      if (!S.drawerOpen) {
        drawerEl.innerHTML = '';
        return;
      }
      var h = '<div class="wptk-drawer">';
      h += '  <div class="wptk-modal-hdr"><h3 class="wptk-modal-title">⚡ Tiến trình Tác vụ Nền (' + S.jobs.length + ')</h3><button type="button" class="wptk-btn wptk-btn-icon" data-act="close-drawer">' + IC.close + '</button></div>';
      h += '  <div class="wptk-modal-body">';
      if (S.jobs.length === 0) {
        h += '<div class="wptk-empty">Chưa có tác vụ chạy nền nào trong phiên này.</div>';
      } else {
        for (var i = 0; i < S.jobs.length; i++) {
          var jb = S.jobs[i];
          var stCls = jb.status === 'succeeded' ? 'wptk-pill-green' : (jb.status === 'failed' ? 'wptk-pill-red' : 'wptk-pill-indigo');
          var pct = jb.status === 'succeeded' ? 100 : (jb.progress || 10);
          h += '<div style="border:1px solid var(--border);border-radius:11px;padding:12px;">';
          h += '  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><strong>' + esc(jb.type) + '</strong><span class="wptk-pill ' + stCls + '">' + esc(jb.status) + '</span></div>';
          h += '  <div style="font-size:12px;color:var(--text-2);margin-top:5px;">' + esc(jb.message || '') + '</div>';
          if (jb.error) {
            h += '<div style="font-size:11.5px;color:var(--red-text);margin-top:4px;">' + esc(jb.error) + '</div>';
          }
          h += '  <div class="wptk-progress-track"><div class="wptk-progress-bar" style="width:' + pct + '%"></div></div>';
          h += '  <div style="font-size:11px;color:var(--muted);margin-top:5px;">Cập nhật: ' + esc(fmtDate(jb.updated_at || jb.created_at)) + '</div>';
          h += '</div>';
        }
      }
      h += '  </div>';
      h += '</div>';
      drawerEl.innerHTML = h;
    }

    /* Data Loaders for Lazy Sub-Tabs & Global Matrices */
    function loadSiteExtensions(id, isTheme) {
      return api(isTheme ? 'list_themes' : 'list_plugins', { instance_id: id }).then(function (res) {
        if (isTheme) S.siteThemes[id] = (res.data && res.data.themes) || [];
        else S.sitePlugins[id] = (res.data && res.data.plugins) || [];
        renderApp();
      }).catch(function (e) { toast(e.message, 'err'); });
    }

    function loadSiteSecurity(id) {
      return Promise.all([
        api('get_security_status', { instance_id: id }),
        api('list_quarantine', { instance_id: id })
      ]).then(function (arr) {
        S.siteSecurity[id] = arr[0].data || {};
        S.siteQuarantine[id] = (arr[1].data && arr[1].data.items) || [];
        var inst = findInstance(id);
        if (inst && S.siteSecurity[id]) {
          inst.security_score = S.siteSecurity[id].security_score || 0;
          inst.security_total = S.siteSecurity[id].security_total || 12;
          inst.core_shield_mode = S.siteSecurity[id].core_shield_mode || inst.core_shield_mode;
          inst.core_integrity_clean = S.siteSecurity[id].core_integrity_clean;
        }
        renderApp();
      }).catch(function (e) { toast(e.message, 'err'); });
    }

    function loadSiteTools(id) {
      return api('get_tools_status', { instance_id: id }).then(function (res) {
        S.siteTools[id] = res.data || {};
        if (res.data && res.data.instance) upsertLocalInstance(res.data.instance);
        renderApp();
      }).catch(function (e) { toast(e.message, 'err'); });
    }

    function loadGlobalExtensions(isTheme) {
      return api(isTheme ? 'list_all_themes' : 'list_all_plugins').then(function (res) {
        if (isTheme) S.globalThemes = (res.data && res.data.themes) || [];
        else S.globalPlugins = (res.data && res.data.plugins) || [];
        renderApp();
      }).catch(function (e) { toast(e.message, 'err'); });
    }

          var h = '<div class="wptk-alert ' + (dry ? '' : 'wptk-alert-ok') + '"><strong>' + (dry ? 'Kết quả xem trước (Chưa ghi DB): ' : 'Đã thay thế thành công: ') + '</strong>' + (d.total_replacements || 0) + ' vị trí trên ' + (d.tables_affected || 0) + ' bảng.</div>';

    /* Unified Event Delegation (Zero Inline JS) */

      }

      if (act === 'refresh-instance' && inst) {

        var vList = (found && found.vulns) || [];
        var vb = vList.map(function (v) {
          return '<div style="border:1px solid var(--red-border);background:var(--red-bg);padding:12px;border-radius:10px;"><div style="display:flex;justify-content:space-between;"><strong>' + esc(v.cve_id || v.id) + ' — ' + esc(v.title) + '</strong><span class="wptk-pill wptk-pill-red">CVSS ' + esc(v.cvss_score || '') + ' (' + esc(v.severity) + ')</span></div><div style="font-size:12px;margin-top:6px;">Bản vá an toàn: <strong>' + esc(v.patched_version || 'Chưa có bản vá — khuyến nghị tắt ngay!') + '</strong></div></div>';

          };

      if (act === 'apply-preset' && inst) {

          toast('Đã hoàn tác quy tắc bảo mật.', 'ok');

        }).catch(function (e) { toast(e.message, 'err'); });

      if (act === 'reload-global-ext') { loadGlobalExtensions(target.getAttribute('data-kind') === 'theme'); return; }
      if (act === 'mass-update-slug') {
        var mKind = target.getAttribute('data-kind');

        var srcGroups = (mKind === 'theme' ? S.globalThemes : S.globalPlugins) || [];

        if (!rIds.length) return;
        var names = rIds.map(function (rid) { var x = findInstance(rid); return x ? (x.domain + (x.sub_path || '')) : rid; }).join(', ');
        var ub = '<div class="wptk-alert wptk-alert-warn">Bạn sắp gỡ cài đặt WordPress tại: <strong>' + esc(names) + '</strong>. Các thư mục Subdomain anh em vẫn được bảo toàn an toàn.</div>';
        ub += '<label class="wptk-check-label" style="margin-top:8px;"><input type="checkbox" id="wptk-rm-db" class="wptk-checkbox" checked /> Xóa luôn cơ sở dữ liệu MariaDB tương ứng trên DirectAdmin</label>';
        ub += '<label class="wptk-check-label" style="margin-top:8px;"><input type="checkbox" id="wptk-rm-snap" class="wptk-checkbox" /> Xóa các bản sao lưu Zstd Snapshot của site này</label>';
        openModal('Xác nhận Gỡ Cài Đặt WordPress', ub, '<button type="button" class="wptk-btn" data-act="close-modal">Hủy</button><button type="button" class="wptk-btn wptk-btn-primary wptk-btn-danger" id="wptk-rm-confirm" style="background:#dc2626;border-color:#dc2626;">Xóa vĩnh viễn</button>');
        document.getElementById('wptk-rm-confirm').onclick = function () {
          var dropDb = document.getElementById('wptk-rm-db').checked;
          var purgeSnap = document.getElementById('wptk-rm-snap').checked;
          this.disabled = true;
          Promise.all(rIds.map(function (rid) {
            return api('uninstall_instance', { instance_id: rid, params: { drop_db: dropDb, purge_snapshots: purgeSnap } });
          })).then(function () {
            S.selectedIds = {};
            closeModal();
            toast('Đã gỡ cài đặt WordPress thành công.', 'ok');
            loadBootstrap(true);
          }).catch(function (e) { toast(e.message, 'err'); });
        };
      }
    });

    /* Checkbox & Switch Change Delegation */
    rootEl.addEventListener('change', function (ev) {
      var el = ev.target;
      var act = el.getAttribute('data-act');
      if (!act) return;
      var id = el.getAttribute('data-id') || '';
      var inst = id ? findInstance(id) : null;
      var checked = !!el.checked;

      if (act === 'toggle-select-all') {
        filteredInstances().forEach(function (it) { S.selectedIds[it.id] = checked; });
        renderApp();
        return;
      }
      if (act === 'toggle-select-one') {
        S.selectedIds[id] = checked;
        renderApp();
        return;
      }
      if (!inst) return;

      if (act === 'toggle-indexing') {
        inst.search_indexing = checked;
        renderApp();
        api('set_search_indexing', { instance_id: id, params: { enabled: checked } }).then(function (r) {
          if (r.data) upsertLocalInstance(r.data);
          renderApp();
          toast('Đã cập nhật trạng thái lập chỉ mục Google!', 'ok');
        }).catch(function (e) { toast(e.message, 'err'); loadBootstrap(true); });
        return;
      }
      if (act === 'toggle-caching') {
        inst.cache_enabled = checked;
        renderApp();
        api('set_caching', { instance_id: id, params: { enabled: checked } }).then(function (r) {
          if (r.data) upsertLocalInstance(r.data);
          renderApp();
          toast('Đã ' + (checked ? 'bật' : 'tắt') + ' bộ nhớ đệm Caching!', 'ok');
        }).catch(function (e) { toast(e.message, 'err'); loadBootstrap(true); });
        return;
      }
      if (act === 'toggle-maintenance') {
        inst.maintenance_mode = checked;
        renderApp();
        api('set_maintenance_mode', { instance_id: id, params: { enabled: checked } }).then(function () {
          toast('Chế độ bảo trì: ' + (checked ? 'ĐANG BẬT (503)' : 'ĐÃ TẮT'), 'ok');
          loadBootstrap(true);
        }).catch(function (e) { toast(e.message, 'err'); loadBootstrap(true); });
        return;
      }
      if (act === 'toggle-debug') {
        inst.debug_mode = checked;
        renderApp();
        api('set_debug_config', { instance_id: id, params: { wp_debug: checked, wp_debug_log: checked, wp_debug_display: false } }).then(function () {
          toast('WP_DEBUG: ' + (checked ? 'ĐANG BẬT' : 'ĐÃ TẮT'), 'ok');
          loadBootstrap(true);
        }).catch(function (e) { toast(e.message, 'err'); loadBootstrap(true); });
        return;
      }
      if (act === 'toggle-pwprotect') {
        if (checked) {
          el.checked = false;
          showPasswordProtectSetup(inst);
        } else {
          api('set_password_protection', { instance_id: id, params: { enabled: false } }).then(function () {
            toast('Đã gỡ khóa mật khẩu HTTP.', 'ok');
            loadBootstrap(true);
          }).catch(function (e) { toast(e.message, 'err'); loadBootstrap(true); });
        }
        return;
      }
      if (act === 'toggle-wpcron') {
        inst.disable_wp_cron = checked;
        renderApp();
        api('set_wp_cron', { instance_id: id, params: { disable_wp_cron: checked, interval_min: inst.cron_interval_min || 15 } }).then(function () {
          toast(checked ? 'Đã chuyển wp-cron sang System Cron DirectAdmin!' : 'Đã quay về wp-cron mặc định.', 'ok');
          loadBootstrap(true);
        }).catch(function (e) { toast(e.message, 'err'); loadBootstrap(true); });
        return;
      }
      if (act === 'toggle-core-shield') {
        var targetMode = checked ? 'auto_heal' : 'monitor';
        api('set_shield_mode', { instance_id: id, params: { mode: targetMode } }).then(function () {
          toast('Core Self-Protection: ' + targetMode, 'ok');
          loadBootstrap(true);
        }).catch(function (e) { toast(e.message, 'err'); loadBootstrap(true); });
        return;
      }
      if (act === 'ext-op') {
        var eKind = el.getAttribute('data-kind') || 'plugin';
        var eOp = el.getAttribute('data-op');
        var eSlug = el.getAttribute('data-slug');
        api(eKind === 'theme' ? 'manage_theme' : 'manage_plugin', {
          instance_id: id,
          params: { operation: eOp, slug: eSlug }
        }).then(function () {
          toast('Đã cập nhật ' + eSlug, 'ok');
          loadSiteExtensions(id, eKind === 'theme');
          loadBootstrap(true);
        }).catch(function (e) { toast(e.message, 'err'); loadSiteExtensions(id, eKind === 'theme'); });
      }
    });

    /* Inline Form Submit Delegation (Safe wp-config.php Editor) */
    rootEl.addEventListener('submit', function (ev) {
      var form = ev.target;
      if (form.getAttribute('data-form') === 'save-wpconfig') {
        ev.preventDefault();
        var id = form.getAttribute('data-id');
        var fd = new FormData(form);
        api('update_safe_wpconfig', {
          instance_id: id,
          params: {
            wp_memory_limit: fd.get('wp_memory_limit'),
            wp_max_memory_limit: fd.get('wp_max_memory_limit'),
            wp_post_revisions: Number(fd.get('wp_post_revisions') || 10),
            autosave_interval: Number(fd.get('autosave_interval') || 60),
            empty_trash_days: Number(fd.get('empty_trash_days') || 30)
          }
        }).then(function () {
          toast('Đã lưu các hằng số an toàn vào wp-config.php!', 'ok');
          loadSiteTools(id);
          loadBootstrap(true);
        }).catch(function (e) { toast(e.message, 'err'); });
      }
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { closeModal(); }
    });

    loadBootstrap(false);
  })();
  </script>
</div>

#!/bin/sh
cat <<'DAWPTK_ADMIN_HTML'
<div id="dawptk-admin-root" data-theme="light">
  <script>
    if (window.self !== window.top) {
      document.documentElement.classList.add('dawptk-iframe');
    }
  </script>
  <style>
    html.dawptk-iframe, html.dawptk-iframe body {
      margin: 0;
      padding: 0;
      background: transparent;
    }
    #dawptk-admin-root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --surface-2: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-2: #334155;
      --muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-btn: #6366f1;
      --primary-soft: #eef2ff;
      --green-bg: #dcfce7;
      --green-text: #15803d;
      --amber-bg: #fef3c7;
      --amber-text: #b45309;
      --red-bg: #fee2e2;
      --red-text: #b91c1c;
      --slate-bg: #e2e8f0;
      --slate-text: #334155;

      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 26px 28px;
      width: 100%;
      box-sizing: border-box;
    }
    html.dark #dawptk-admin-root:not([data-user-theme="light"]),
    body.dark #dawptk-admin-root:not([data-user-theme="light"]),
    #dawptk-admin-root[data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273549;
      --border: #334155;
      --border-strong: #475569;
      --text: #f8fafc;
      --text-2: #cbd5e1;
      --muted: #94a3b8;
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --primary-btn: #6366f1;
      --primary-soft: rgba(99, 102, 241, 0.16);
      --green-bg: rgba(22, 163, 74, 0.22);
      --green-text: #4ade80;
      --amber-bg: rgba(217, 119, 6, 0.22);
      --amber-text: #fbbf24;
      --red-bg: rgba(220, 38, 38, 0.22);
      --red-text: #f87171;
      --slate-bg: #334155;
      --slate-text: #e2e8f0;
    }
    #dawptk-admin-root *, #dawptk-admin-root *::before, #dawptk-admin-root *::after { box-sizing: border-box; }
    #dawptk-admin-root button, #dawptk-admin-root input, #dawptk-admin-root select, #dawptk-admin-root textarea { font: inherit; }

    .adm-hdr { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .adm-brand { display: flex; align-items: center; gap: 13px; }
    .adm-logo { width: 42px; height: 42px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
    .adm-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
    .adm-tab { padding: 10px 15px; border: none; border-bottom: 2.5px solid transparent; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap; margin-bottom: -1px; }
    .adm-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    .adm-btn { display: inline-flex; align-items: center; gap: 6px; height: 33px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text-2); font-size: 12.5px; font-weight: 500; cursor: pointer; }
    .adm-btn:hover:not(:disabled) { background: var(--surface); border-color: var(--border-strong); color: var(--text); }
    .adm-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .adm-btn-primary { background: var(--primary-btn); border-color: var(--primary-btn); color: #fff !important; font-weight: 600; }
    .adm-btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .adm-btn-danger { color: var(--red-text); border-color: var(--red-bg); }
    .adm-btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

    .adm-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .adm-stat { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--surface); }
    .adm-stat-lbl { font-size: 11.5px; color: var(--muted); font-weight: 600; }
    .adm-stat-val { font-size: 21px; font-weight: 700; margin-top: 4px; color: var(--text); }
    .adm-stat-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .adm-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; }
    .adm-panel { border: 1px solid var(--border); border-radius: 13px; padding: 18px; background: var(--bg); margin-bottom: 16px; }
    .adm-grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 16px; }
    .adm-form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .adm-field { display: flex; flex-direction: column; gap: 5px; }
    .adm-field label { font-size: 12px; font-weight: 600; color: var(--text-2); }
    .adm-input, .adm-select { width: 100%; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; }

    .adm-table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
    .adm-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .adm-table th { text-align: left; padding: 10px 13px; background: var(--surface); color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .adm-table td { padding: 10px 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .adm-table tr:last-child td { border-bottom: none; }

    .adm-pill { display: inline-flex; align-items: center; height: 21px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .adm-pill-green { background: var(--green-bg); color: var(--green-text); }
    .adm-pill-amber { background: var(--amber-bg); color: var(--amber-text); }
    .adm-pill-red { background: var(--red-bg); color: var(--red-text); }
    .adm-pill-slate { background: var(--slate-bg); color: var(--slate-text); }
    .adm-pill-indigo { background: var(--primary-soft); color: var(--primary); }

    .adm-code { background: #0f172a; color: #e2e8f0; border-radius: 10px; padding: 12px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; white-space: pre-wrap; max-height: 280px; overflow: auto; }
    .adm-toasts { position: fixed; right: 20px; bottom: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .adm-toast { padding: 11px 15px; border-radius: 10px; background: #0f172a; color: #f8fafc; font-size: 12.5px; border-left: 4px solid var(--primary-btn); }
    .adm-toast.ok { border-left-color: #22c55e; }
    .adm-toast.err { border-left-color: #ef4444; }
  </style>

  <div id="dawptk-admin-app">Đang kết nối tới dịch vụ quản trị da-wptoolkitd...</div>
  <div id="dawptk-admin-toasts" class="adm-toasts"></div>

  <script>
  (function () {
    'use strict';

    var API_URL = '/CMD_PLUGINS_ADMIN/da_wp_toolkits/api.raw';
    var rootEl = document.getElementById('dawptk-admin-root');
    var appEl = document.getElementById('dawptk-admin-app');
    var toastEl = document.getElementById('dawptk-admin-toasts');

    var A = {
      csrf: '',
      tab: 'overview',
      theme: localStorage.getItem('dawptk_adm_theme') || '',
      overview: null,
      instances: [],
      search: '',
      vulnOnly: false,
      packagesData: null,
      selectedPkg: '',
      sets: [],
      updaterCfg: null,
      githubCheck: null
    };

    function syncTheme() {
      if (A.theme === 'dark' || A.theme === 'light') {
        rootEl.setAttribute('data-theme', A.theme);
        rootEl.setAttribute('data-user-theme', A.theme);
      } else {
        var dark = document.documentElement.classList.contains('dark') || document.body.classList.contains('dark');
        rootEl.setAttribute('data-theme', dark ? 'dark' : 'light');
      }
    }
    syncTheme();

    function esc(v) {
      if (v === null || v === undefined) return '';
      return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function fmtBytes(n) {
      var b = Number(n) || 0;
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      if (b < 1073741824) return (b / 1048576).toFixed(2) + ' MB';
      return (b / 1073741824).toFixed(2) + ' GB';
    }

    function fmtUptime(sec) {
      var s = Number(sec) || 0;
      var h = Math.floor(s / 3600);
      var m = Math.floor((s % 3600) / 60);
      if (h > 0) return h + 'h ' + m + 'm';
      return m + 'm ' + (s % 60) + 's';
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      if (isNaN(d.getTime()) || d.getFullYear() < 2000) return '—';
      return d.toLocaleString('vi-VN');
    }

    function toast(msg, kind) {
      var d = document.createElement('div');
      d.className = 'adm-toast ' + (kind || '');
      d.textContent = msg;
      toastEl.appendChild(d);
      setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 4000);
    }

    var READ_ONLY = {
      ping: 1, get_overview: 1, list_instances: 1, get_vulndb_status: 1,
      get_core_cache_status: 1, list_sets: 1, list_jobs: 1, get_security_events: 1,
      list_packages: 1, get_updater_config: 1, check_github_update: 1
    };

    function api(action, opts) {
      opts = opts || {};
      var isRead = !!READ_ONLY[action] && !opts.params && !opts.username && !opts.instance_id;
      var url = API_URL;
      var fetchOpts = { credentials: 'same-origin', headers: {} };

      if (isRead) {
        url += '?action=' + encodeURIComponent(action);
      } else {
        fetchOpts.method = 'POST';
        fetchOpts.headers['Content-Type'] = 'application/json';
        if (A.csrf) fetchOpts.headers['X-DAWPTK-CSRF'] = A.csrf;
        fetchOpts.body = JSON.stringify({
          action: action,
          csrf_token: A.csrf,
          username: opts.username || '',
          instance_id: opts.instance_id || '',
          limit: opts.limit || 0,
          params: opts.params || {}
        });
      }

      return fetch(url, fetchOpts)
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res && res.csrf_token) A.csrf = res.csrf_token;
          if (!res || !res.ok) throw new Error((res && res.error) ? res.error : ('Admin IPC Error: ' + action));
          return res;
        });
    }

    function loadOverview() {
      return Promise.all([
        api('get_overview'),
        api('list_instances')
      ]).then(function (arr) {
        A.overview = arr[0].data || {};
        A.instances = (arr[1].data && arr[1].data.instances) || [];
        render();
      }).catch(function (e) {
        appEl.innerHTML = '<div class="adm-panel"><strong>Không thể kết nối da-wptoolkitd:</strong> ' + esc(e.message) + '</div>';
      });
    }

    function loadPoliciesAndSets() {
      return Promise.all([
        api('list_packages'),
        api('list_sets')
      ]).then(function (arr) {
        A.packagesData = arr[0].data || {};
        A.sets = (arr[1].data && arr[1].data.sets) || [];
        var pkgs = A.packagesData.packages || [];
        if (!A.selectedPkg && pkgs.length > 0) A.selectedPkg = pkgs[0].name;
        render();
      }).catch(function (e) { toast(e.message, 'err'); });
    }

    function loadUpdaterTab() {
      return api('get_updater_config').then(function (res) {
        A.updaterCfg = res.data || {};
        render();
      }).catch(function (e) { toast(e.message, 'err'); });
    }

    function render() {
      var ov = A.overview || {};
      var ping = ov.ping || {};

      var h = '<div class="adm-hdr">';
      h += '  <div class="adm-brand"><div class="adm-logo">W</div><div><h2 style="margin:0;font-size:19px;font-weight:700;">DA WordPress Toolkits — Server Admin Console</h2><div style="font-size:12.5px;color:var(--muted);margin-top:2px;">Quản trị toàn máy chủ, Chính sách Hosting Package, Local Verified Core Cache, Wordfence CVE Feed &amp; Cập nhật Ed25519.</div></div></div>';
      h += '  <div style="display:flex;gap:8px;align-items:center;">';
      h += '    <span class="adm-pill adm-pill-green">● ONLINE ' + esc(ping.version || 'v0.6.0') + '</span>';
      h += '    <button type="button" class="adm-btn adm-btn-sm" data-adm="toggle-theme">' + (rootEl.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙') + '</button>';
      h += '    <button type="button" class="adm-btn" data-adm="refresh">↻ Làm mới</button>';
      h += '  </div>';
      h += '</div>';

      h += '<div class="adm-tabs">';
      h += '  <button type="button" class="adm-tab ' + (A.tab === 'overview' ? 'active' : '') + '" data-adm="tab" data-tab="overview">1. Toàn cảnh &amp; An ninh (' + (ov.managed_sites || 0) + ')</button>';
      h += '  <button type="button" class="adm-tab ' + (A.tab === 'policies' ? 'active' : '') + '" data-adm="tab" data-tab="policies">2. Chính sách Gói Hosting &amp; Sets</button>';
      h += '  <button type="button" class="adm-tab ' + (A.tab === 'cache_cve' ? 'active' : '') + '" data-adm="tab" data-tab="cache_cve">3. Kho Đệm Core &amp; CVE Feed</button>';
      h += '  <button type="button" class="adm-tab ' + (A.tab === 'updater' ? 'active' : '') + '" data-adm="tab" data-tab="updater">4. Hệ thống &amp; Cập nhật GitHub</button>';
      h += '</div>';

      if (A.tab === 'overview') h += renderTabOverview(ov, ping);
      else if (A.tab === 'policies') h += renderTabPolicies();
      else if (A.tab === 'cache_cve') h += renderTabCacheCVE(ov);
      else if (A.tab === 'updater') h += renderTabUpdater();

      appEl.innerHTML = h;

      var sIn = document.getElementById('adm-search-in');
      if (sIn) {
        sIn.oninput = function () { A.search = this.value || ''; render(); };
      }
    }

    /* Tab 1: Global Server Overview, Fleet Table & Security Audit Events */
    function renderTabOverview(ov, ping) {
      var h = '<div class="adm-stats">';
      h += '<div class="adm-stat"><div class="adm-stat-lbl">Dịch vụ &amp; Web Server</div><div class="adm-stat-val">' + esc(ping.web_server || 'auto') + '</div><div class="adm-stat-sub">Uptime: ' + esc(fmtUptime(ping.uptime_seconds)) + '</div></div>';
      h += '<div class="adm-stat"><div class="adm-stat-lbl">Tài khoản DirectAdmin</div><div class="adm-stat-val">' + (ov.hosting_accounts || 0) + '</div><div class="adm-stat-sub">Đang hoạt động</div></div>';
      h += '<div class="adm-stat"><div class="adm-stat-lbl">Tổng Site WordPress</div><div class="adm-stat-val">' + (ov.managed_sites || 0) + '</div><div class="adm-stat-sub">Main / Addon / Subdomain</div></div>';
      h += '<div class="adm-stat"><div class="adm-stat-lbl">Site dính Lỗ hổng CVE</div><div class="adm-stat-val" style="color:' + ((ov.vulnerable_sites || 0) > 0 ? 'var(--red-text)' : 'var(--green-text)') + '">' + (ov.vulnerable_sites || 0) + '</div><div class="adm-stat-sub">Wordfence Community Feed</div></div>';
      h += '<div class="adm-stat"><div class="adm-stat-lbl">Cảnh báo Core Shield</div><div class="adm-stat-val" style="color:' + ((ov.core_attention_sites || 0) > 0 ? 'var(--amber-text)' : 'var(--green-text)') + '">' + (ov.core_attention_sites || 0) + '</div><div class="adm-stat-sub">SHA-256 Checksum Monitor</div></div>';
      h += '<div class="adm-stat"><div class="adm-stat-lbl">Kernel inotify Watches</div><div class="adm-stat-val">' + (ov.inotify_watches || 0) + '</div><div class="adm-stat-sub">Ngân sách tối đa: ' + (ov.inotify_max_budget || 0) + '</div></div>';
      h += '</div>';

      h += '<div class="adm-bar">';
      h += '  <div style="display:flex;gap:8px;flex-wrap:wrap;">';
      h += '    <button type="button" class="adm-btn adm-btn-primary" data-adm="scan-all">🔍 Quét toàn máy chủ</button>';
      h += '    <button type="button" class="adm-btn" data-adm="verify-all-core">🛡 Kiểm tra &amp; Phục hồi Core toàn cục</button>';
      h += '    <button type="button" class="adm-btn" data-adm="patch-all-vuln">⚡ Vá Smart Update toàn bộ site có cập nhật</button>';
      h += '  </div>';
      h += '  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">';
      h += '    <label style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer;"><input type="checkbox" id="adm-vuln-chk" ' + (A.vulnOnly ? 'checked' : '') + ' data-adm="toggle-vuln-only" /> Chỉ hiện site có CVE</label>';
      h += '    <input id="adm-search-in" class="adm-input" style="width:230px;" placeholder="Lọc user, domain..." value="' + esc(A.search) + '" />';
      h += '  </div>';
      h += '</div>';

      var q = A.search.trim().toLowerCase();
      var rows = A.instances.filter(function (it) {
        if (A.vulnOnly && !(it.vuln_count > 0)) return false;
        if (q && (it.owner + ' ' + it.domain + ' ' + (it.sub_path || '') + ' ' + it.wp_version).toLowerCase().indexOf(q) === -1) return false;
        return true;
      });

      h += '<div class="adm-table-wrap" style="margin-bottom:18px;"><table class="adm-table"><thead><tr><th>User</th><th>Domain / Path</th><th>WP / PHP</th><th>Core Shield</th><th>Hardening</th><th>CVE / Updates</th><th style="text-align:right">Điều phối nhanh</th></tr></thead><tbody>';
      if (rows.length === 0) {
        h += '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:24px;">Không có website WordPress nào khớp bộ lọc.</td></tr>';
      } else {
        rows.forEach(function (it) {
          var mode = it.core_shield_mode || 'auto_heal';
          h += '<tr>';
          h += '<td><strong>' + esc(it.owner) + '</strong></td>';
          h += '<td><strong>' + esc(it.domain + (it.sub_path || '')) + '</strong><div style="font-size:11px;color:var(--muted);">' + esc(it.doc_root) + '</div></td>';
          h += '<td><span class="adm-pill adm-pill-green">WP ' + esc(it.wp_version) + '</span> <span class="adm-pill adm-pill-slate">PHP ' + esc(it.php_version || 'def') + '</span></td>';
          h += '<td><span class="adm-pill adm-pill-indigo">' + esc(mode) + '</span></td>';
          h += '<td>' + (it.security_score || 0) + '/' + (it.security_total || 12) + '</td>';
          h += '<td>' + (it.vuln_count > 0 ? '<span class="adm-pill adm-pill-red">⚠ ' + it.vuln_count + ' CVE</span> ' : '') + (it.update_count > 0 ? '<span class="adm-pill adm-pill-amber">' + it.update_count + ' upd</span>' : '<span class="adm-pill adm-pill-green">OK</span>') + '</td>';
          h += '<td style="text-align:right;white-space:nowrap;">';
          h += '  <button type="button" class="adm-btn adm-btn-primary adm-btn-sm" data-adm="sso" data-id="' + esc(it.id) + '">SSO</button> ';
          h += '  <button type="button" class="adm-btn adm-btn-sm" data-adm="verify-one" data-id="' + esc(it.id) + '">Heal Core</button> ';
          if (mode === 'fortress_lock') {
            h += '<button type="button" class="adm-btn adm-btn-sm" data-adm="unlock-one" data-id="' + esc(it.id) + '">Unlock</button>';
          } else {
            h += '<button type="button" class="adm-btn adm-btn-sm" data-adm="lock-one" data-id="' + esc(it.id) + '">Fortress Lock</button>';
          }
          h += '</td></tr>';
        });
      }
      h += '</tbody></table></div>';

      var evs = ov.recent_security_events || [];
      h += '<div class="adm-panel"><strong style="display:block;margin-bottom:10px;">Nhật ký Sự kiện Bảo mật Gần nhất (IPC Anti-Spoofing, Symlink Guard &amp; Core Auto-Heal)</strong>';
      if (evs.length === 0) {
        h += '<div style="color:var(--muted);font-size:12.5px;">Chưa ghi nhận cảnh báo an ninh bất thường nào.</div>';
      } else {
        h += '<div class="adm-table-wrap"><table class="adm-table"><thead><tr><th>Thời gian</th><th>Mức độ</th><th>Phân loại</th><th>Tài khoản</th><th>Chi tiết</th></tr></thead><tbody>';
        evs.forEach(function (ev) {
          var cls = ev.severity === 'critical' ? 'adm-pill-red' : (ev.severity === 'warning' ? 'adm-pill-amber' : 'adm-pill-indigo');
          h += '<tr><td>' + esc(fmtDate(ev.timestamp)) + '</td><td><span class="adm-pill ' + cls + '">' + esc(ev.severity) + '</span></td><td><code>' + esc(ev.category) + '</code></td><td>' + esc(ev.owner || ('UID ' + (ev.peer_uid || 0))) + '</td><td>' + esc(ev.message) + '</td></tr>';
        });
        h += '</tbody></table></div>';
      }
      h += '</div>';
      return h;
    }

    /* Tab 2: Package Policies & Global Built-in/System Sets */
    function renderPolicyFields(pol) {
      pol = pol || {};
      var mode = pol.default_core_shield_mode || 'auto_heal';
      var h = '<div class="adm-form-grid">';
      h += '<div class="adm-field"><label>Số site tối đa (0 = Không giới hạn)</label><input type="number" name="max_instances" class="adm-input" min="0" max="10000" value="' + esc(pol.max_instances || 0) + '" /></div>';
      h += '<div class="adm-field"><label>Số bản Snapshot tối đa / site</label><input type="number" name="max_snapshots_per_site" class="adm-input" min="0" max="100" value="' + esc(pol.max_snapshots_per_site !== undefined ? pol.max_snapshots_per_site : 5) + '" /></div>';
      h += '<div class="adm-field"><label>Chế độ Core Shield mặc định</label><select name="default_core_shield_mode" class="adm-select"><option value="auto_heal" ' + (mode === 'auto_heal' ? 'selected' : '') + '>Auto-Heal &amp; Quarantine</option><option value="fortress_lock" ' + (mode === 'fortress_lock' ? 'selected' : '') + '>Fortress Core Lock</option><option value="monitor" ' + (mode === 'monitor' ? 'selected' : '') + '>Monitor Only</option></select></div>';
      h += '</div>';
      h += '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;">';
      h += '<label style="display:inline-flex;align-items:center;gap:6px;"><input type="checkbox" name="enabled" ' + (pol.enabled !== false ? 'checked' : '') + ' /> Cho phép dùng WordPress Toolkit</label>';
      h += '<label style="display:inline-flex;align-items:center;gap:6px;"><input type="checkbox" name="allow_clone" ' + (pol.allow_clone !== false ? 'checked' : '') + ' /> Cho phép Clone / Staging</label>';
      h += '<label style="display:inline-flex;align-items:center;gap:6px;"><input type="checkbox" name="allow_staging_sync" ' + (pol.allow_staging_sync !== false ? 'checked' : '') + ' /> Cho phép Staging Sync 2 chiều</label>';
      h += '<label style="display:inline-flex;align-items:center;gap:6px;"><input type="checkbox" name="allow_core_fortress_lock" ' + (pol.allow_core_fortress_lock !== false ? 'checked' : '') + ' /> Cho phép bật Fortress Core Lock</label>';
      h += '<label style="display:inline-flex;align-items:center;gap:6px;"><input type="checkbox" name="auto_hardening_on_install" ' + (pol.auto_hardening_on_install !== false ? 'checked' : '') + ' /> Tự động bật 6 quy tắc Critical khi cài mới</label>';
      h += '</div>';
      return h;
    }

    function renderTabPolicies() {
      if (!A.packagesData) {
        return '<div class="adm-panel">Đang tải danh sách Hosting Packages &amp; Chính sách...</div>';
      }
      var defPol = A.packagesData.default_policy || {};
      var pkgs = A.packagesData.packages || [];
      var curPkgObj = null;
      for (var i = 0; i < pkgs.length; i++) if (pkgs[i].name === A.selectedPkg) curPkgObj = pkgs[i];

      var h = '<div class="adm-grid-2">';
      /* Global Default Policy */
      h += '<form class="adm-panel" data-adm-form="save-default-pol">';
      h += '<strong style="display:block;margin-bottom:12px;">Chính sách Mặc định Toàn Máy Chủ (Default Policy)</strong>';
      h += renderPolicyFields(defPol);
      h += '<div style="margin-top:14px;display:flex;justify-content:flex-end;"><button type="submit" class="adm-btn adm-btn-primary">Lưu Chính Sách Mặc Định</button></div>';
      h += '</form>';

      /* Per-Package Override */
      h += '<form class="adm-panel" data-adm-form="save-pkg-pol">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;"><strong>Ghi đè theo Gói Hosting DirectAdmin</strong>';
      if (pkgs.length > 0) {
        h += '<select class="adm-select" style="width:auto;" data-adm="pick-pkg">';
        pkgs.forEach(function (p) {
          h += '<option value="' + esc(p.name) + '" ' + (p.name === A.selectedPkg ? 'selected' : '') + '>' + esc(p.name) + ' (' + p.account_count + ' user' + (p.has_override ? ' • Custom' : '') + ')</option>';
        });
        h += '</select>';
      }
      h += '</div>';
      if (!curPkgObj) {
        h += '<div style="color:var(--muted);">Nhập tên gói Hosting mới để cấu hình giới hạn riêng:</div><input name="package_name" class="adm-input" style="margin:8px 0;" placeholder="vd: starter" required />' + renderPolicyFields(defPol);
      } else {
        h += '<input type="hidden" name="package_name" value="' + esc(curPkgObj.name) + '" />';
        h += renderPolicyFields(curPkgObj.policy);
      }
      h += '<div style="margin-top:14px;display:flex;justify-content:flex-end;gap:8px;">';
      if (curPkgObj && curPkgObj.has_override) {
        h += '<button type="button" class="adm-btn adm-btn-danger" data-adm="reset-pkg-pol" data-pkg="' + esc(curPkgObj.name) + '">Khôi phục kế thừa mặc định</button>';
      }
      h += '<button type="submit" class="adm-btn adm-btn-primary">Lưu Chính Sách Gói</button></div></form>';
      h += '</div>';

      /* Global System Plugin/Theme Sets */
      h += '<div class="adm-panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><strong>Bộ Plugin &amp; Theme Sets Toàn Máy Chủ (' + A.sets.length + ')</strong><button type="button" class="adm-btn adm-btn-primary adm-btn-sm" data-adm="add-global-set">+ Tạo Bộ Set Toàn Cục</button></div>';
      h += '<div class="adm-table-wrap"><table class="adm-table"><thead><tr><th>Tên Bộ Set</th><th>Mô tả</th><th>Plugins</th><th>Themes</th><th style="text-align:right">Thao tác</th></tr></thead><tbody>';
      A.sets.forEach(function (ps) {
        h += '<tr><td><strong>' + esc(ps.name) + '</strong> ' + (ps.built_in ? '<span class="adm-pill adm-pill-indigo">Built-in</span>' : '') + '</td><td>' + esc(ps.description || '') + '</td><td>' + esc((ps.plugins || []).join(', ')) + '</td><td>' + esc((ps.themes || []).join(', ') || '—') + '</td><td style="text-align:right">' + (!ps.built_in ? '<button type="button" class="adm-btn adm-btn-sm adm-btn-danger" data-adm="del-global-set" data-set="' + esc(ps.id) + '">Xóa</button>' : '—') + '</td></tr>';
      });
      h += '</tbody></table></div></div>';
      return h;
    }

    /* Tab 3: Local Verified Core Cache & Wordfence CVE Intelligence DB */
    function renderTabCacheCVE(ov) {
      var cc = ov.core_cache || {};
      var rels = cc.releases || [];
      var vdb = ov.vulndb || {};

      var h = '<div class="adm-grid-2">';
      /* Local Verified Core Cache */
      h += '<div class="adm-panel">';
      h += '  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><strong>Local Verified Core Cache</strong><span class="adm-pill adm-pill-indigo">Tổng dung lượng: ' + esc(fmtBytes(cc.total_bytes || 0)) + '</span></div>';
      h += '  <div style="font-size:12px;color:var(--muted);margin-bottom:12px;">Đường dẫn: <code>' + esc(cc.base_dir || '/var/cache/da-wptoolkit/wp-core') + '</code> — đối chiếu MD5 chính thức từ <code>api.wordpress.org</code> để khôi phục Core bị sửa đổi trong &lt;50ms.</div>';
      h += '  <form data-adm-form="seed-core" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">';
      h += '    <input name="wp_version" class="adm-input" style="width:120px;" placeholder="vd: 6.7.1" value="6.7.1" required />';
      h += '    <input name="locale" class="adm-input" style="width:110px;" placeholder="vi / en_US" value="en_US" required />';
      h += '    <button type="submit" class="adm-btn adm-btn-primary">⬇ Tải &amp; Xác thực Core Sạch</button>';
      h += '  </form>';
      h += '  <div class="adm-table-wrap"><table class="adm-table"><thead><tr><th>Phiên bản</th><th>Ngôn ngữ</th><th>Số tệp</th><th>Kích thước</th><th style="text-align:right">Xóa</th></tr></thead><tbody>';
      if (rels.length === 0) {
        h += '<tr><td colspan="5" style="text-align:center;color:var(--muted);">Kho đệm hiện đang trống (sẽ tự tải khi cần hoặc bấm nút trên).</td></tr>';
      } else {
        rels.forEach(function (r) {
          h += '<tr><td><strong>' + esc(r.version) + '</strong></td><td><code>' + esc(r.locale) + '</code></td><td>' + (r.file_count || 0) + '</td><td>' + esc(fmtBytes(r.size_bytes)) + '</td><td style="text-align:right"><button type="button" class="adm-btn adm-btn-sm adm-btn-danger" data-adm="del-cache" data-ver="' + esc(r.version) + '" data-loc="' + esc(r.locale) + '">Xóa</button></td></tr>';
        });
      }
      h += '  </tbody></table></div></div>';

      /* Wordfence CVE DB */
      h += '<div class="adm-panel">';
      h += '  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><strong>Wordfence Intelligence CVE Feed (v2)</strong><button type="button" class="adm-btn adm-btn-primary adm-btn-sm" data-adm="sync-vulndb">↻ Đồng bộ CVE ngay</button></div>';
      h += '  <div style="font-size:12px;color:var(--muted);margin-bottom:14px;">Cơ sở dữ liệu lỗ hổng bảo mật miễn phí cho Core, Plugins và Themes (tự động cập nhật nền mỗi 12 giờ, không cần API key).</div>';
      h += '  <div class="adm-stats" style="grid-template-columns:1fr 1fr;">';
      h += '    <div class="adm-stat"><div class="adm-stat-lbl">Tổng bản ghi CVE</div><div class="adm-stat-val">' + (vdb.record_count || vdb.total_records || 0) + '</div></div>';
      h += '    <div class="adm-stat"><div class="adm-stat-lbl">Slugs đang theo dõi</div><div class="adm-stat-val">' + (vdb.slug_count || vdb.indexed_slugs || 0) + '</div></div>';
      h += '  </div>';
      h += '  <div style="font-size:12.5px;color:var(--text-2);">Lần đồng bộ gần nhất: <strong>' + esc(fmtDate(vdb.last_synced_at)) + '</strong></div>';
      h += '</div>';
      h += '</div>';
      return h;
    }

    /* Tab 4: System & Ed25519 Signed GitHub Self-Updater */
    function renderTabUpdater() {
      var u = A.updaterCfg;
      if (!u) return '<div class="adm-panel">Đang tải cấu hình GitHub Self-Updater...</div>';
      var chk = A.githubCheck;

      var h = '<div class="adm-grid-2">';
      h += '<div class="adm-panel">';
      h += '  <strong style="display:block;margin-bottom:10px;">Trạng thái Phiên bản &amp; Chữ ký Số Ed25519</strong>';
      h += '  <div style="display:flex;flex-direction:column;gap:8px;font-size:13px;margin-bottom:14px;">';
      h += '    <div>Phiên bản hiện tại: <span class="adm-pill adm-pill-green">' + esc(u.current_version) + '</span></div>';
      h += '    <div>Kho lưu trữ cố định: <code>' + esc(u.github_repo) + '</code></div>';
      h += '    <div>Khóa công khai Ed25519: <code style="font-size:11px;word-break:break-all;">' + esc(u.public_key_hex) + '</code></div>';
      h += '  </div>';
      h += '  <button type="button" class="adm-btn adm-btn-primary" data-adm="check-gh-update">🔍 Kiểm tra phiên bản mới từ GitHub Releases</button>';
      if (chk) {
        h += '<div style="margin-top:14px;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);">';
        h += '  <div style="display:flex;justify-content:space-between;align-items:center;"><strong>Bản mới nhất: ' + esc(chk.latest_version) + '</strong>' + (chk.update_available ? '<span class="adm-pill adm-pill-amber">Có bản cập nhật mới!</span>' : '<span class="adm-pill adm-pill-green">Đang ở bản mới nhất</span>') + '</div>';
        if (chk.changelog) {
          h += '<div class="adm-code" style="margin-top:8px;">' + esc(chk.changelog) + '</div>';
        }
        h += '</div>';
      }
      h += '  <div style="margin-top:14px;"><div style="font-size:12px;color:var(--muted);margin-bottom:6px;">Tham chiếu lệnh CLI quản trị viên (SSH root):</div><div class="adm-code">da-wptoolkit ping\nda-wptoolkit scan --all\nda-wptoolkit verify-core --all\nda-wptoolkit sync-vulndb</div></div>';
      h += '</div>';

      h += '<form class="adm-panel" data-adm-form="save-updater">';
      h += '  <strong style="display:block;margin-bottom:12px;">Cấu hình Kênh Cập nhật &amp; GitHub Token (/etc/da-wptoolkit/updater.conf)</strong>';
      h += '  <div class="adm-form-grid">';
      h += '    <div class="adm-field"><label>Kênh phát hành (Update Channel)</label><select name="update_channel" class="adm-select"><option value="stable" ' + (u.update_channel === 'stable' ? 'selected' : '') + '>Stable (Khuyến nghị Production)</option><option value="beta" ' + (u.update_channel === 'beta' ? 'selected' : '') + '>Beta / Pre-release</option></select></div>';
      h += '    <div class="adm-field"><label>Số bản sao lưu Rollback giữ lại</label><input type="number" name="backup_retention" class="adm-input" min="1" max="50" value="' + esc(u.backup_retention || 5) + '" /></div>';
      h += '  </div>';
      h += '  <div class="adm-field" style="margin-top:12px;"><label>GitHub Personal Access Token (Chỉ ghi 0600 — Trạng thái: ' + (u.has_github_token ? 'Đã cấu hình ẩn' : 'Chưa đặt / Public Repo') + ')</label><input type="password" name="github_token" class="adm-input" autocomplete="new-password" placeholder="Để trống nếu giữ nguyên token hiện tại" /></div>';
      if (u.has_github_token) {
        h += '<label style="display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;"><input type="checkbox" name="clear_github_token" /> Xóa GitHub Token đã lưu</label>';
      }
      h += '  <div style="margin-top:16px;display:flex;justify-content:flex-end;"><button type="submit" class="adm-btn adm-btn-primary">Lưu Cấu Hình Updater</button></div>';
      h += '</form>';
      h += '</div>';
      return h;
    }

    /* Event Delegation */
    rootEl.addEventListener('click', function (ev) {
      var btn = ev.target.closest('[data-adm]');
      if (!btn || btn.tagName === 'SELECT' || btn.tagName === 'INPUT') return;
      var act = btn.getAttribute('data-adm');
      var id = btn.getAttribute('data-id') || '';

      if (act === 'toggle-theme') {
        var next = rootEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        A.theme = next;
        localStorage.setItem('dawptk_adm_theme', next);
        syncTheme();
        render();
        return;
      }
      if (act === 'refresh') { loadOverview(); if (A.tab === 'policies') loadPoliciesAndSets(); if (A.tab === 'updater') loadUpdaterTab(); toast('Đã làm mới dữ liệu!', 'ok'); return; }
      if (act === 'tab') {
        A.tab = btn.getAttribute('data-tab') || 'overview';
        render();
        if (A.tab === 'policies' && !A.packagesData) loadPoliciesAndSets();
        if (A.tab === 'updater' && !A.updaterCfg) loadUpdaterTab();
        return;
      }
      if (act === 'scan-all') {
        toast('Đang quét Zero-Eval toàn bộ tài khoản trên máy chủ...');
        api('scan_instances', { params: { reattach: false } }).then(function (res) {
          var d = res.data || {};
          toast('Quét hoàn tất: ' + (d.discovered_total || 0) + ' website (mới: ' + (d.added_count || 0) + ')!', 'ok');
          loadOverview();
        }).catch(function (e) { toast(e.message, 'err'); });
        return;
      }
      if (act === 'verify-all-core') {
        toast('Đang đối chiếu SHA-256 & phục hồi Core toàn máy chủ...');
        api('verify_core', { params: { all: true, heal: true } }).then(function (res) {
          var reps = (res.data && res.data.reports) || [];
          toast('Đã kiểm tra toàn vẹn Core cho ' + reps.length + ' website!', 'ok');
          loadOverview();
        }).catch(function (e) { toast(e.message, 'err'); });
        return;
      }
      if (act === 'patch-all-vuln') {
        var ids = A.instances.filter(function (x) { return x.update_count > 0 || x.vuln_count > 0; }).map(function (x) { return x.id; });
        if (!ids.length) { toast('Không có website nào cần cập nhật bản vá.', 'ok'); return; }
        if (!confirm('Thực thi Bulk Smart Safe Update (có Auto-Rollback) cho ' + ids.length + ' website?')) return;
        api('bulk_smart_update', { params: { instance_ids: ids, all_plugins: true, all_themes: true } }).then(function () {
          toast('Đã đẩy tác vụ vá bảo mật hàng loạt cho ' + ids.length + ' website!', 'ok');
        }).catch(function (e) { toast(e.message, 'err'); });
        return;
      }
      if (act === 'sso') {
        var w = window.open('about:blank', '_blank');
        api('sso_login', { instance_id: id }).then(function (res) {
          if (w && res.data && res.data.login_url) w.location.href = res.data.login_url;
        }).catch(function (e) { if (w) w.close(); toast(e.message, 'err'); });
        return;
      }
      if (act === 'verify-one') {
        api('verify_core', { instance_id: id, params: { heal: true } }).then(function () { toast('Đã kiểm tra & phục hồi Core sạch!', 'ok'); loadOverview(); }).catch(function (e) { toast(e.message, 'err'); });
        return;
      }
      if (act === 'lock-one' || act === 'unlock-one') {
        api(act === 'lock-one' ? 'lock_core' : 'unlock_core', { instance_id: id }).then(function () { toast('Đã cập nhật trạng thái Fortress Core Lock!', 'ok'); loadOverview(); }).catch(function (e) { toast(e.message, 'err'); });
        return;
      }
      if (act === 'reset-pkg-pol') {
        var pkg = btn.getAttribute('data-pkg');
        api('delete_package_policy', { params: { package_name: pkg } }).then(function () { toast('Gói ' + pkg + ' đã quay về kế thừa chính sách mặc định.', 'ok'); loadPoliciesAndSets(); }).catch(function (e) { toast(e.message, 'err'); });
        return;
      }
      if (act === 'add-global-set') {
        var nm = prompt('Tên Bộ Set toàn máy chủ:');
        if (!nm) return;
        var pl = prompt('Danh sách Plugin slugs (phân tách dấu phẩy):', 'litespeed-cache, wordfence');
        if (pl === null) return;
        api('save_set', { params: { name: nm, description: 'Global Server Set', plugins: pl } }).then(function () { toast('Đã tạo Bộ Set toàn máy chủ!', 'ok'); loadPoliciesAndSets(); }).catch(function (e) { toast(e.message, 'err'); });
        return;
      }
      if (act === 'del-global-set') {
        if (!confirm('Xóa Bộ Set toàn cục này?')) return;
        api('delete_set', { params: { set_id: btn.getAttribute('data-set') } }).then(function () { toast('Đã xóa Bộ Set.', 'ok'); loadPoliciesAndSets(); }).catch(function (e) { toast(e.message, 'err'); });
        return;
      }
      if (act === 'del-cache') {
        api('delete_core_cache', { params: { wp_version: btn.getAttribute('data-ver'), locale: btn.getAttribute('data-loc') } }).then(function () { toast('Đã xóa bản đệm Core.', 'ok'); loadOverview(); }).catch(function (e) { toast(e.message, 'err'); });
        return;
      }
      if (act === 'sync-vulndb') {
        toast('Đang đồng bộ Wordfence Intelligence Community CVE Feed...');
        api('sync_vulndb', { params: {} }).then(function () { toast('Đã đồng bộ cơ sở dữ liệu CVE thành công!', 'ok'); loadOverview(); }).catch(function (e) { toast(e.message, 'err'); });
        return;
      }
      if (act === 'check-gh-update') {
        toast('Đang kiểm tra GitHub Releases...');
        api('check_github_update', { params: {} }).then(function (res) {
          A.githubCheck = res.data || {};
          render();
          toast('Đã kiểm tra phiên bản mới nhất: ' + (A.githubCheck.latest_version || ''), 'ok');
        }).catch(function (e) { toast(e.message, 'err'); });
      }
    });

    rootEl.addEventListener('change', function (ev) {
      var el = ev.target;
      var act = el.getAttribute('data-adm');
      if (act === 'toggle-vuln-only') { A.vulnOnly = !!el.checked; render(); }
      if (act === 'pick-pkg') { A.selectedPkg = el.value; render(); }
    });

    rootEl.addEventListener('submit', function (ev) {
      var form = ev.target;
      var kind = form.getAttribute('data-adm-form');
      if (!kind) return;
      ev.preventDefault();
      var fd = new FormData(form);

      if (kind === 'save-default-pol' || kind === 'save-pkg-pol') {
        var p = {
          max_instances: Number(fd.get('max_instances') || 0),
          max_snapshots_per_site: Number(fd.get('max_snapshots_per_site') || 5),
          default_core_shield_mode: fd.get('default_core_shield_mode') || 'auto_heal',
          enabled: fd.get('enabled') === 'on',
          allow_clone: fd.get('allow_clone') === 'on',
          allow_staging_sync: fd.get('allow_staging_sync') === 'on',
          allow_core_fortress_lock: fd.get('allow_core_fortress_lock') === 'on',
          auto_hardening_on_install: fd.get('auto_hardening_on_install') === 'on'
        };
        if (kind === 'save-pkg-pol') p.package_name = fd.get('package_name');
        api(kind === 'save-pkg-pol' ? 'save_package_policy' : 'save_default_policy', { params: p }).then(function () {
          toast('Đã lưu chính sách thành công!', 'ok');
          loadPoliciesAndSets();
        }).catch(function (e) { toast(e.message, 'err'); });
        return;
      }

      if (kind === 'seed-core') {
        toast('Đang tải & kiểm chứng MD5 gói WordPress Core sạch...');
        api('seed_core_cache', { params: { wp_version: fd.get('wp_version'), locale: fd.get('locale') } }).then(function (res) {
          var d = res.data || {};
          toast('Đã nạp Core ' + d.version + ' (' + d.locale + ', ' + d.file_count + ' tệp)!', 'ok');
          loadOverview();
        }).catch(function (e) { toast(e.message, 'err'); });
        return;
      }

      if (kind === 'save-updater') {
        api('save_updater_config', {
          params: {
            update_channel: fd.get('update_channel'),
            backup_retention: Number(fd.get('backup_retention') || 5),
            github_token: fd.get('github_token') || '',
            clear_github_token: fd.get('clear_github_token') === 'on'
          }
        }).then(function () {
          toast('Đã lưu cấu hình GitHub Self-Updater (0600)!', 'ok');
          loadUpdaterTab();
        }).catch(function (e) { toast(e.message, 'err'); });
      }
    });

    loadOverview();
  })();
